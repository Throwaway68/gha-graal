name: Spike Windows ssh

# THROWAWAY (round 2, task 1). The same steps graalvm-dev.yml gets, without the GraalVM build, so
# that one iteration on scripts/graalvm/win-ssh.ps1 costs 2 to 4 minutes instead of 15. Delete once
# the mechanism works in graalvm-dev.yml.

# Push-triggered, not workflow_dispatch: a dispatch needs the workflow file on the default branch
# (HTTP 404 "not found on the default branch"), and this one must never land there. So every push
# of the script to this branch is one spike iteration.
on:
  push:
    branches: [round2-ssh]
    paths:
      - 'scripts/graalvm/win-ssh.ps1'
      - '.github/workflows/win-ssh-spike.yml'

permissions:
  contents: read

jobs:
  spike:
    name: OpenSSH + cloudflared on windows-2022
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Windows MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Stand in for the build steps
        shell: bash
        # graalvm-dev.yml reaches the ssh step with these in the environment; the session has to
        # carry them, so the spike sets the same names to something that exists.
        run: |
          echo "GRAALVM_HOME=$GITHUB_WORKSPACE/jdk" >> "$GITHUB_ENV"
          echo "MX_PATH=$GITHUB_WORKSPACE/mx" >> "$GITHUB_ENV"
      - name: Debug over ssh (Windows OpenSSH + cloudflared)
        timeout-minutes: 10
        shell: pwsh
        run: pwsh ci/scripts/graalvm/win-ssh.ps1 -Actor '${{ github.actor }}' -OutDir "$env:RUNNER_TEMP\ssh" -HoldFile "$env:RUNNER_TEMP\gha-hold"
      - name: Upload the ssh address
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ssh-windows-amd64
          path: ${{ runner.temp }}/ssh/address.txt
          if-no-files-found: ignore
      - name: Upload the cloudflared log
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ssh-spike-log
          path: ${{ runner.temp }}/ssh/cloudflared.log
          if-no-files-found: ignore
      - name: Hold the runner for the ssh session
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        shell: bash
        run: |
          hold=$RUNNER_TEMP/gha-hold
          echo "holding the runner; in the ssh session run: rm '$hold'"
          while [ -f "$hold" ]; do sleep 15; done
          echo "hold released"
