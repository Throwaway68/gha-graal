name: GraalVM dev

# Fast iteration loop for the Windows LLVM backend: build a lean GraalVM (compiler,
# SubstrateVM, native-image driver, LLVM backend tool, LLVM.org toolchain) from a graal
# ref, build one program under tests/programs with `--tool:llvm-backend`, upload the
# native-image work directory. mx's downloads are cached per platform and the build itself
# per platform + JDK + graal SHA, so re-running the same graal commit (another program,
# other ni_args, after a failure) reuses the GraalVM built by the previous run.

on:
  workflow_dispatch:
    inputs:
      graal_ref:
        description: 'Ref in Throwaway68/graal'
        default: 'graal/25.3.4.1-win-llvm'
        required: true
        type: string
      llvm_release:
        description: 'LLVM release tag in this repo'
        default: 'llvm-22.1.8-graal.2'
        required: true
        type: string
      platform:
        description: 'One platform'
        default: 'windows-amd64'
        type: choice
        options: [windows-amd64, linux-amd64, darwin-aarch64]
      program:
        description: 'Directory under tests/programs'
        default: 'hello'
        type: string
      ni_args:
        description: 'Extra native-image arguments'
        default: ''
        type: string

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  MX_GIT_CACHE: refcache
  PYTHONIOENCODING: utf-8

jobs:
  dev:
    name: ${{ inputs.platform }} / ${{ inputs.program }}
    runs-on: ${{ inputs.platform == 'windows-amd64' && 'windows-2022' || inputs.platform == 'darwin-aarch64' && 'macos-14' || 'ubuntu-22.04' }}
    timeout-minutes: 240
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Checkout graal
        uses: actions/checkout@v7.0.1
        with:
          repository: Throwaway68/graal
          ref: ${{ inputs.graal_ref }}
          path: graal
          fetch-depth: 1
      - name: Derive paths
        shell: bash
        run: |
          echo "MX_PATH=$GITHUB_WORKSPACE/mx" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$GITHUB_WORKSPACE/jdk" >> "$GITHUB_ENV"
          echo "MX_VERSION=$(jq -r '.mx_version' graal/common.json)" >> "$GITHUB_ENV"
          echo "JDK_ID=$(jq -r '.jdks["labsjdk-ce-latest"].version' graal/common.json)" >> "$GITHUB_ENV"
          echo "GRAAL_SHA=$(git -C graal rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "MX_PYTHON=python" >> "$GITHUB_ENV"; else echo "MX_PYTHON=python3" >> "$GITHUB_ENV"; fi
      - name: Checkout mx
        uses: actions/checkout@v7.0.1
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: mx
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja cmake || true
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      # Two caches, both restored/saved explicitly instead of with actions/cache@v4: that
      # action's post step is `post-if: success()`, so a job that fails at dev-run (the
      # expected Windows outcome until the backend works) would never save its build.
      #
      # 1. mx's download cache: the graal dependencies (~1 GB, LLVM_ORG alone is 40 s) do not
      #    depend on the graal commit, so this one falls back by platform and helps every run.
      #    Without it mx re-downloads them, and because a fresh download is newer than every
      #    build output, "dependency ANTLR4 updated" / "dependency LLVM_ORG updated" rebuild
      #    the shaded jars, the Truffle processors, the LLVM toolchain and the GraalVM layout
      #    even from a fully populated mxbuild (run 35219010453).
      - name: Restore mx download cache
        id: mxdl
        uses: actions/cache/restore@v4
        with:
          path: ~/.mx/cache
          key: dev-mxdl-${{ inputs.platform }}-${{ env.JDK_ID }}-${{ env.GRAAL_SHA }}
          restore-keys: |
            dev-mxdl-${{ inputs.platform }}-${{ env.JDK_ID }}-
            dev-mxdl-${{ inputs.platform }}-
      # 2. the build itself. No restore-keys: mx decides what to rebuild from file timestamps
      #    and a checkout stamps every source with the time of the run, so a cache from a
      #    *different* graal commit is rebuilt from scratch anyway - measured on windows-amd64
      #    (runs 35216649197 cold vs 35217642476 from a fallback hit): restoring 5 GB costs
      #    ~2 min and saved nothing. Only an exact hit - the same graal commit run again with
      #    another program, other ni_args or after a failure - is worth restoring.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            graal/*/mxbuild
            mx/mxbuild
          key: dev-mxbuild-${{ inputs.platform }}-${{ env.JDK_ID }}-${{ env.GRAAL_SHA }}
      - name: Cache state
        shell: bash
        run: |
          echo "mx downloads: ${{ steps.mxdl.outputs.cache-matched-key }} (exact: ${{ steps.mxdl.outputs.cache-hit }})"
          echo "build:        ${{ steps.cache.outputs.cache-matched-key }} (exact: ${{ steps.cache.outputs.cache-hit }})"
      - name: Fetch LabsJDK
        shell: bash
        # Run inside the graal checkout so mx resolves labsjdk-ce-latest from graal/common.json.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/jdk-dl"
          cd graal
          "$MX_PATH/mx" --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "$GITHUB_WORKSPACE/jdk-dl" --alias "$JAVA_HOME"
          if [ -d "$JAVA_HOME/Contents/Home" ]; then echo "JAVA_HOME=$JAVA_HOME/Contents/Home" >> "$GITHUB_ENV"; fi
      - name: Point graal at our LLVM release (MX_URLREWRITES)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.llvm_release }}" --repo "${{ github.repository }}" --pattern manifest.json --dir llvm-release --clobber
          python3 ci/scripts/release_tools.py urlrewrites llvm-release/manifest.json \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.llvm_release }}" > urlrewrites.json
          echo "MX_URLREWRITES=$GITHUB_WORKSPACE/urlrewrites.json" >> "$GITHUB_ENV"
      - name: Install env file
        shell: bash
        run: cp ci/mx-env/ce-llvm-dev graal/vm/mx.vm/ce-llvm-dev
      - name: Age the build inputs
        shell: bash
        run: |
          python3 - <<'EOF'
          # mx rebuilds a target when an input is newer than its output, and every input outside
          # mxbuild arrives fresh in a hosted run: actions/checkout stamps the graal and mx trees
          # with the time of this run and mx re-downloads the LabsJDK ("Deleting stale
          # ...jdk-dl..."). A restored mxbuild is then rebuilt from scratch - directly
          # ("HostProxyException.class[11:38:28] is older than HostProxyException.java[11:49:01]",
          # run 35217642476), through *directory* mtimes, which ninja and archive tasks compare
          # too ("llvm-toolchain.tar[12:22:14] is older than graal\sdk\llvm-patches\backports" and
          # "ninja explain: output build.ninja older than most recent input .../include", run
          # 35221772232), and through the LabsJDK's lib/modules timestamp, which mx stores in the
          # graalvm-jimage config ("the configuration changed").
          #
          # Giving all of them one fixed old timestamp fixes that, and unconditionally: without a
          # restore-keys fallback the build cache is either an exact hit - then this checkout, mx
          # and JDK are the ones that produced it, so the restored outputs really are up to date -
          # or empty, and then nothing can be wrongly skipped. Doing it on cold runs too is what
          # makes the recorded jimage config match on the next run.
          import os
          stamp = 946684800  # 2000-01-01T00:00:00Z, older than any build output
          files, dirs = [], []
          for root in ('graal', 'mx', 'jdk-dl', 'jdk'):
              if not os.path.isdir(root):
                  continue
              dirs.append(root)
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in ('.git', 'mxbuild')]
                  dirs += [os.path.join(dirpath, d) for d in dirnames]
                  files += [os.path.join(dirpath, f) for f in filenames]
          def touch(p):
              try:
                  os.utime(p, (stamp, stamp))
                  return True
              except OSError:
                  return False
          def stale(p):
              try:
                  return int(os.stat(p).st_mtime) != stamp
              except OSError:
                  return False
          n = sum(touch(p) for p in files)
          # Directories after the files and deepest first, then re-stamped while they still look
          # new. This is best effort on NTFS and cannot be made reliable there: the file
          # timestamps are duplicated into the parent's index entry and flushed asynchronously,
          # so a directory that verifies as old here comes back with the current time a second
          # later (run 35223782654: verified at 13:21:16.8, read by ninja as 13:21:18.4). The
          # "Freshen the restored build outputs" step below is what actually wins that race.
          dirs.reverse()
          left, passes = dirs, 0
          while left and passes < 5:
              passes += 1
              for d in left:
                  touch(d)
              left = [d for d in left if stale(d)]
          print(f'backdated {n}/{len(files)} files and {len(dirs) - len(left)}/{len(dirs)} '
                f'directories to 2000-01-01 in {passes} pass(es)')
          if left:
              print(f'WARNING: {len(left)} directories kept a newer mtime, e.g. {left[:3]}')
          EOF
      - name: Freshen the restored build outputs
        if: steps.cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          python3 - <<'EOF'
          # NTFS duplicates a file's timestamps into its parent's directory index entry and
          # flushes that asynchronously, so backdating a source tree bumps its directories back
          # to the current time a moment later - after the step that backdated them has already
          # verified they were old (run 35226210569: the step finished at 13:21:16.8 and ninja
          # then read graal/truffle/src/com.oracle.truffle.attach/include as 13:21:18.4, which
          # regenerated every native project and, through TRUFFLE_API, half the build).
          # Nothing can be done about that from the source side, so put the restored outputs an
          # hour into the future instead: no bump landing during this run can beat them. Only on
          # an exact cache hit, where the restored outputs are the ones this very commit, mx and
          # JDK produced. mx and ninja both compare strictly (isOlderThan: arg.timestamp >
          # self.timestamp), so one shared timestamp for all outputs means none of them is stale.
          import os, time
          stamp = time.time() + 3600
          t0 = time.time()
          roots = [os.path.join('graal', d, 'mxbuild') for d in os.listdir('graal')]
          roots = [r for r in roots if os.path.isdir(r)] + [r for r in ['mx/mxbuild'] if os.path.isdir(r)]
          generated_src = ('gensrc', 'jni_gen')
          def touch(p):
              try:
                  os.utime(p, (stamp, stamp))
                  return 1
              except OSError:
                  return 0
          n, ninja = 0, 0
          for root in roots:
              for dirpath, dirnames, filenames in os.walk(root):
                  # A ninja build directory is left alone except for build.ninja: ninja's deps log
                  # remembers the mtime each object had when its header dependencies were
                  # recorded, and an object that is suddenly newer means "stored deps info out of
                  # date for 'src/launcher.obj'" and a rebuild (run 35227444918). build.ninja
                  # itself has to move, so that it outranks the source directories that NTFS
                  # bumps to the current time.
                  if 'build.ninja' in filenames:
                      dirnames[:] = []
                      ninja += touch(os.path.join(dirpath, 'build.ninja'))
                      continue
                  # The native sources mx generates into mxbuild (gensrc/JvmFuncsFallbacks.c,
                  # jni_gen/*.h) are ninja inputs whose objects keep their old mtimes above, so
                  # they have to stay behind as well ("ninja explain: output
                  # .../JvmFuncsFallbacks.obj older than most recent input .../JvmFuncsFallbacks.c",
                  # run 35228721057). Only those directories: headers elsewhere in mxbuild are
                  # ordinary outputs that mx does compare (skipping them made com.oracle.svm.core
                  # recompile over its own bin/.../sharedGCStructs.h in run 35229643502).
                  dirnames[:] = [d for d in dirnames if d not in generated_src]
                  for name in dirnames + filenames:
                      n += touch(os.path.join(dirpath, name))
              n += touch(root)
          print(f'stamped {n} restored build outputs (and {ninja} build.ninja, keeping their '
                f'objects) in {", ".join(roots)} one hour ahead in {time.time() - t0:.0f}s')
          EOF
      - name: Build (Linux/macOS)
        id: build_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd graal/vm
          "$MX_PATH/mx" --env ce-llvm-dev graalvm-show
          "$MX_PATH/mx" --env ce-llvm-dev build
          echo "GRAALVM_HOME=$("$MX_PATH/mx" --env ce-llvm-dev graalvm-home)" >> "$GITHUB_ENV"
      - name: Build (Windows)
        id: build_win
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd graal\vm
          call %MX_PATH%\mx.cmd --env ce-llvm-dev graalvm-show
          call %MX_PATH%\mx.cmd --env ce-llvm-dev build
          call %MX_PATH%\mx.cmd --env ce-llvm-dev graalvm-home > graalvm-home.txt
          set /p GRAALVM_HOME=<graalvm-home.txt
          echo GRAALVM_HOME=%GRAALVM_HOME%>>%GITHUB_ENV%
      - name: Save mx download cache
        if: always() && steps.mxdl.outputs.cache-hit != 'true' && (steps.build_unix.outcome == 'success' || steps.build_win.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: ~/.mx/cache
          key: ${{ steps.mxdl.outputs.cache-primary-key }}
      - name: Save build cache
        if: always() && steps.cache.outputs.cache-hit != 'true' && (steps.build_unix.outcome == 'success' || steps.build_win.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: |
            graal/*/mxbuild
            mx/mxbuild
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: dev-run
        shell: bash
        run: bash ci/scripts/graalvm/dev-run.sh "$GRAALVM_HOME" "ci/tests/programs/${{ inputs.program }}" "$GITHUB_WORKSPACE/work" ${{ inputs.ni_args }}
      - name: Upload work directory
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dev-${{ inputs.platform }}-${{ inputs.program }}
          path: |
            work/stdout.txt
            work/stderr.txt
            work/tmp/**/llvm/*.o
            work/tmp/**/llvm/*.obj
            work/tmp/**/llvm/win*.bc
            work/tmp/**/reports/**
          if-no-files-found: ignore
