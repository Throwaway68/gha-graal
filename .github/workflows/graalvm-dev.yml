name: GraalVM dev

# Fast iteration loop for the Windows LLVM backend: build a lean GraalVM (compiler,
# SubstrateVM, native-image driver, LLVM backend tool, LLVM.org toolchain) from a graal
# ref, build one program under tests/programs with `--tool:llvm-backend`, upload the
# native-image work directory. Every run builds the GraalVM from scratch; only mx's downloads
# are cached.

on:
  workflow_dispatch:
    inputs:
      graal_ref:
        description: 'Ref in Throwaway68/graal'
        default: 'graal/25.3.4.1-win-llvm'
        required: true
        type: string
      llvm_release:
        description: 'LLVM release tag in this repo'
        default: 'llvm-22.1.8-graal.3'
        required: true
        type: string
      platform:
        description: 'One platform'
        default: 'windows-amd64'
        type: choice
        options: [windows-amd64, linux-amd64, darwin-aarch64]
      program:
        description: 'Directory under tests/programs'
        default: 'hello'
        type: string
      ni_args:
        description: 'Extra native-image arguments'
        default: ''
        type: string
      debug_ssh:
        description: 'Open an interactive ssh/tmate session on the runner after dev-run'
        default: false
        type: boolean

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  MX_GIT_CACHE: refcache
  PYTHONIOENCODING: utf-8

jobs:
  dev:
    name: ${{ inputs.platform }} / ${{ inputs.program }}
    runs-on: ${{ inputs.platform == 'windows-amd64' && 'windows-2022' || inputs.platform == 'darwin-aarch64' && 'macos-14' || 'ubuntu-22.04' }}
    timeout-minutes: 240
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Checkout graal
        uses: actions/checkout@v7.0.1
        with:
          repository: Throwaway68/graal
          ref: ${{ inputs.graal_ref }}
          path: graal
          fetch-depth: 1
      - name: Derive paths
        shell: bash
        # JDK_ID and GRAAL_SHA are not used by any later step; they are here so that every step's
        # environment dump in the log says exactly which JDK and which graal commit was built.
        run: |
          echo "MX_PATH=$GITHUB_WORKSPACE/mx" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$GITHUB_WORKSPACE/jdk" >> "$GITHUB_ENV"
          echo "MX_VERSION=$(jq -r '.mx_version' graal/common.json)" >> "$GITHUB_ENV"
          echo "JDK_ID=$(jq -r '.jdks["labsjdk-ce-latest"].version' graal/common.json)" >> "$GITHUB_ENV"
          echo "GRAAL_SHA=$(git -C graal rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "MX_PYTHON=python" >> "$GITHUB_ENV"; else echo "MX_PYTHON=python3" >> "$GITHUB_ENV"; fi
      - name: Checkout mx
        uses: actions/checkout@v7.0.1
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: mx
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja cmake || true
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      # One cache: mx's downloads (~1.2 GB; LLVM_ORG alone is a 40 s download). What they are
      # is decided by the LLVM release the URL rewrites point at and by the suite files that name
      # the dependencies, so that is the key - not the graal commit.
      #
      # There is deliberately no cache of the build outputs (controller ruling, 2026-09-17): tasks
      # 6 to 8 push a new graal commit per iteration, where a `graal/*/mxbuild` cache reuses
      # nothing - mx rebuilds from file timestamps, and a checkout stamps every source with the
      # time of the run - while still costing ~3.5 min to save on Windows. Keeping it useful meant
      # rewriting the timestamps of the restored tree, and its key did not name `llvm_release`, so
      # the same graal commit rebuilt against a new LLVM release would have silently kept the old
      # toolchain. A cold lean build is ~7.5 min on windows-amd64, ~5.5 min on linux-amd64.
      #
      # restore/save rather than actions/cache@v4: that action's post step is `post-if: success()`,
      # so a job that fails at dev-run - the expected Windows outcome until the backend works -
      # would never save anything.
      #
      # jdk-dl is not cached either: mx deletes and re-downloads the LabsJDK on every run
      # ("Deleting stale ...jdk-dl\labsjdk-ce-latest-..." in run 35219010453), which takes 9 to
      # 20 s, so caching it only adds save time.
      - name: Restore mx download cache
        id: mxdl
        uses: actions/cache/restore@v4
        with:
          path: ~/.mx/cache
          key: dev-mxdl-${{ inputs.platform }}-${{ inputs.llvm_release }}-${{ hashFiles('graal/common.json', 'graal/*/mx.*/suite.py') }}
          # A suite.py edit - task 6 does exactly that - must not mean downloading everything
          # again; mx checks each artifact's digest, so an older set is safe to start from.
          restore-keys: |
            dev-mxdl-${{ inputs.platform }}-${{ inputs.llvm_release }}-
      - name: Fetch LabsJDK
        shell: bash
        # Run inside the graal checkout so mx resolves labsjdk-ce-latest from graal/common.json.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/jdk-dl"
          cd graal
          "$MX_PATH/mx" --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "$GITHUB_WORKSPACE/jdk-dl" --alias "$JAVA_HOME"
          if [ -d "$JAVA_HOME/Contents/Home" ]; then echo "JAVA_HOME=$JAVA_HOME/Contents/Home" >> "$GITHUB_ENV"; fi
      - name: Point graal at our LLVM release (MX_URLREWRITES)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.llvm_release }}" --repo "${{ github.repository }}" --pattern manifest.json --dir llvm-release --clobber
          python3 ci/scripts/release_tools.py urlrewrites llvm-release/manifest.json \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.llvm_release }}" > urlrewrites.json
          echo "MX_URLREWRITES=$GITHUB_WORKSPACE/urlrewrites.json" >> "$GITHUB_ENV"
      - name: Install env file
        shell: bash
        run: cp ci/mx-env/ce-llvm-dev graal/vm/mx.vm/ce-llvm-dev
      - name: Build (Linux/macOS)
        id: build_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd graal/vm
          "$MX_PATH/mx" --env ce-llvm-dev graalvm-show
          "$MX_PATH/mx" --env ce-llvm-dev build
          echo "GRAALVM_HOME=$("$MX_PATH/mx" --env ce-llvm-dev graalvm-home)" >> "$GITHUB_ENV"
      - name: Build (Windows)
        id: build_win
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd graal\vm
          call %MX_PATH%\mx.cmd --env ce-llvm-dev graalvm-show
          call %MX_PATH%\mx.cmd --env ce-llvm-dev build
          call %MX_PATH%\mx.cmd --env ce-llvm-dev graalvm-home > graalvm-home.txt
          set /p GRAALVM_HOME=<graalvm-home.txt
          echo GRAALVM_HOME=%GRAALVM_HOME%>>%GITHUB_ENV%
      - name: Save mx download cache
        if: steps.mxdl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.mx/cache
          key: ${{ steps.mxdl.outputs.cache-primary-key }}
      - name: dev-run
        shell: bash
        run: bash ci/scripts/graalvm/dev-run.sh "$GRAALVM_HOME" "ci/tests/programs/${{ inputs.program }}" "$GITHUB_WORKSPACE/work" ${{ inputs.ni_args }}
      # Interactive debugging instead of a workflow round trip per attempt (the user's tip): with
      # `debug_ssh` on, the job stops here - after the build and after dev-run, whichever failed -
      # and prints an ssh command and a web-shell URL for this runner. The session ends when you
      # type `exit` (or after the step timeout), then the job finishes normally and still uploads
      # the artifact.
      #
      # `limit-access-to-actor: true` authorizes only the public SSH keys of the account that
      # dispatched the run, because this repository is public and the connection string lands in
      # the log. That account needs a key at https://github.com/settings/keys; with none, tmate
      # authorizes nobody and the session is unusable (deliberately - do not lower this to
      # `auto`, which would leave the runner open to anyone reading the log).
      - name: Debug over ssh (tmate)
        if: ${{ !cancelled() && inputs.debug_ssh }}
        timeout-minutes: 180
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true
          connect-timeout-seconds: 300
      - name: Upload work directory
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dev-${{ inputs.platform }}-${{ inputs.program }}
          path: |
            work/stdout.txt
            work/stderr.txt
            work/tmp/**/llvm/*.o
            work/tmp/**/llvm/*.obj
            work/tmp/**/llvm/win*.bc
            work/tmp/**/reports/**
          if-no-files-found: ignore
