name: GraalVM

on:
  workflow_dispatch:
    inputs:
      graal_ref:
        description: 'Ref in Throwaway68/graal to build'
        default: 'graal/25.3.4.1-win-llvm'
        required: true
        type: string
      llvm_release:
        description: 'Release tag in this repo providing the LLVM bundles (llvm-<version>)'
        default: 'llvm-22.1.8-graal.3'
        required: true
        type: string
      label:
        description: 'Archive/release label (default: <graal_ref>-<llvm_release>, slashes replaced by dashes)'
        default: ''
        type: string
      publish:
        description: 'Create the GitHub release'
        default: true
        type: boolean
      platforms:
        description: 'Comma-separated subset of linux-amd64,darwin-aarch64,windows-amd64 to build'
        default: 'linux-amd64,darwin-aarch64,windows-amd64'
        required: true
        type: string

permissions:
  contents: write

env:
  LANG: en_US.UTF-8
  MX_GIT_CACHE: refcache
  PYTHONIOENCODING: utf-8

jobs:
  plan:
    name: Select platforms
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          all='[{"os":"ubuntu-22.04","platform":"linux-amd64"},{"os":"macos-14","platform":"darwin-aarch64"},{"os":"windows-2022","platform":"windows-amd64"}]'
          sel=$(jq -c --arg p ',${{ inputs.platforms }},' '[.[] | select(.platform as $x | $p | contains("," + $x + ","))]' <<<"$all")
          echo "matrix=$sel" >> "$GITHUB_OUTPUT"
          echo "building: $sel"
          [ "$sel" != "[]" ] || { echo "no platform selected" >&2; exit 1; }

  build:
    name: ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Checkout graal
        uses: actions/checkout@v7.0.1
        with:
          repository: Throwaway68/graal
          ref: ${{ inputs.graal_ref }}
          path: graal
      - name: Derive label and paths
        shell: bash
        run: |
          label='${{ inputs.label }}'
          if [ -z "$label" ]; then label="${{ inputs.graal_ref }}-${{ inputs.llvm_release }}"; fi
          label=${label//\//-}
          echo "LABEL=$label" >> "$GITHUB_ENV"
          echo "MX_PATH=$GITHUB_WORKSPACE/mx" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$GITHUB_WORKSPACE/jdk" >> "$GITHUB_ENV"
          echo "MX_VERSION=$(jq -r '.mx_version' graal/common.json)" >> "$GITHUB_ENV"
          echo "GRAAL_SHA=$(git -C graal rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "MX_PYTHON=python" >> "$GITHUB_ENV"; else echo "MX_PYTHON=python3" >> "$GITHUB_ENV"; fi
      - name: Checkout mx
        uses: actions/checkout@v7.0.1
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: mx
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja cmake || true
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Fetch LabsJDK
        shell: bash
        # Run inside the graal checkout so mx resolves labsjdk-ce-latest from graal/common.json
        # (outside it, mx falls back to its own bundled, older JDK definitions).
        run: |
          mkdir -p "$GITHUB_WORKSPACE/jdk-dl"
          cd graal
          "$MX_PATH/mx" --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "$GITHUB_WORKSPACE/jdk-dl" --alias "$JAVA_HOME"
          ls "$GITHUB_WORKSPACE/jdk-dl"
          if [ -d "$JAVA_HOME/Contents/Home" ]; then echo "JAVA_HOME=$JAVA_HOME/Contents/Home" >> "$GITHUB_ENV"; fi
      - name: Point graal at our LLVM release (MX_URLREWRITES)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.llvm_release }}" --repo "${{ github.repository }}" --pattern manifest.json --dir llvm-release --clobber
          python3 ci/scripts/release_tools.py urlrewrites llvm-release/manifest.json \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.llvm_release }}" > urlrewrites.json
          cat urlrewrites.json
          echo "MX_URLREWRITES=$GITHUB_WORKSPACE/urlrewrites.json" >> "$GITHUB_ENV"
      - name: Install env file
        shell: bash
        run: cp ci/mx-env/ce-llvm-ci graal/vm/mx.vm/ce-llvm-ci
      - name: Build GraalVM (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd graal/vm
          "$MX_PATH/mx" --env ce-llvm-ci graalvm-show
          "$MX_PATH/mx" --env ce-llvm-ci build
          echo "GRAALVM_HOME=$("$MX_PATH/mx" --env ce-llvm-ci graalvm-home)" >> "$GITHUB_ENV"
      - name: Build GraalVM (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd graal\vm
          call %MX_PATH%\mx.cmd --env ce-llvm-ci graalvm-show
          call %MX_PATH%\mx.cmd --env ce-llvm-ci build
          call %MX_PATH%\mx.cmd --env ce-llvm-ci graalvm-home > graalvm-home.txt
          set /p GRAALVM_HOME=<graalvm-home.txt
          echo GRAALVM_HOME=%GRAALVM_HOME%>>%GITHUB_ENV%
      - name: Smoke test
        shell: bash
        run: |
          bash ci/scripts/graalvm/smoke.sh "$GRAALVM_HOME" "$GITHUB_WORKSPACE/smoke"
          # smoke.sh stops at a hello world. Where the LLVM backend is registered,
          # also build and run tests/programs/{stress,complex,export}: the runtime
          # (exceptions, GC, threads), JNI in both directions against a library the
          # bundled clang builds here, and an entry point resolved by its symbol.
          if [ -d "$GRAALVM_HOME/lib/svm/tools/llvm-backend" ] || [ -d "$GRAALVM_HOME/lib/svm/macros/llvm-backend" ]; then
            bash ci/scripts/graalvm/smoke-stress.sh "$GRAALVM_HOME" "$GITHUB_WORKSPACE/stress"
          fi
      - name: Package
        shell: bash
        run: bash ci/scripts/graalvm/package.sh "$GRAALVM_HOME" "graalvm-$LABEL-${{ matrix.platform }}" "${{ matrix.platform }}" "$GITHUB_WORKSPACE/out"
      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: graalvm-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Download archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: graalvm-*
          merge-multiple: true
          path: assets
      - name: Derive label
        shell: bash
        run: |
          label='${{ inputs.label }}'
          if [ -z "$label" ]; then label="${{ inputs.graal_ref }}-${{ inputs.llvm_release }}"; fi
          echo "LABEL=${label//\//-}" >> "$GITHUB_ENV"
      - name: Write manifest
        run: |
          python3 ci/scripts/release_tools.py manifest assets --version "$LABEL" > manifest.json
          mv manifest.json assets/
          cat assets/manifest.json
      # The archives are ~1 GB each and uploads.github.com answers "HTTP 500: Error
      # saving asset" often enough that a single `gh release create <tag> assets/*`
      # is a coin flip - and when one upload fails, gh deletes the whole release.
      # So (as in llvm.yml): create the release empty and as a draft, upload the
      # assets one by one with retries, verify every one of them against the local
      # file, and only then publish.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="graalvm-$LABEL"
          if state=$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::release $tag already exists and is published; pick a new label instead of overwriting it"
              exit 1
            fi
            echo "reusing the existing draft $tag"
            exit 0
          fi
          cat > notes.md <<EOF
          GraalVM CE built from \`Throwaway68/graal@${{ inputs.graal_ref }}\` with the LLVM toolchain from release \`${{ inputs.llvm_release }}\`.
          Platforms in this release: ${{ inputs.platforms }}.
          Components: CE base, LLVM.org toolchain, Sulong (LLVM runtime), Native Image LLVM backend where the branch registers it.
          Native Image LLVM backend: every platform of this release builds and runs \`tests/programs/stress\` (exceptions, GC, threads), \`tests/programs/complex\` (JNI in both directions plus a \`@CEntryPoint\` entered from C through a function pointer) and \`tests/programs/export\` (a \`@CEntryPoint\` resolved by its symbol) with \`--tool:llvm-backend\` in this run's smoke test.
          The Windows backend needs \`llvm-22.1.8-graal.3\` or newer: it carries the Win64 home-space fix for \`CallingConv::GRAAL\` and libunwind for \`x86_64-w64-windows-gnu\`.
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "GraalVM $LABEL" \
            --notes-file notes.md \
            --draft
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="graalvm-$LABEL"
          rc=0
          for f in assets/*; do
            uploaded=no
            for attempt in 1 2 3 4 5 6; do
              echo "== uploading $(basename "$f") ($(stat -c%s "$f") bytes), attempt $attempt/6"
              if gh release upload "$tag" "$f" --repo "${{ github.repository }}" --clobber; then
                uploaded=yes
                break
              fi
              echo "attempt $attempt for $(basename "$f") failed"
              if [ "$attempt" -lt 6 ]; then
                sleep 60
              fi
            done
            if [ "$uploaded" != yes ]; then
              echo "::error::$(basename "$f") could not be uploaded in 6 attempts"
              rc=1
            fi
          done
          exit $rc
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="graalvm-$LABEL"
          gh release view "$tag" --repo "${{ github.repository }}" --json assets > published.json
          jq '[.assets[] | {name, size, state}]' published.json
          rc=0
          for f in assets/*; do
            name=$(basename "$f")
            want=$(stat -c%s "$f")
            got=$(jq -r --arg n "$name" 'first(.assets[] | select(.name == $n) | .size) // "missing"' published.json)
            state=$(jq -r --arg n "$name" 'first(.assets[] | select(.name == $n) | .state) // "missing"' published.json)
            if [ "$got" != "$want" ]; then
              echo "::error::$name: published size $got, expected $want"
              rc=1
            elif [ "$state" != "uploaded" ]; then
              echo "::error::$name: asset state is '$state', expected 'uploaded'"
              rc=1
            else
              echo "ok $name ($want bytes)"
            fi
          done
          exit $rc
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "graalvm-$LABEL" --repo "${{ github.repository }}" --draft=false
          gh release view "graalvm-$LABEL" --repo "${{ github.repository }}" --json url,isDraft,assets \
            -q '.url, .isDraft, ([.assets[].name] | join(" "))'
