name: LLVM toolchain

on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: 'Ref in Throwaway68/llvm-project to build'
        default: 'graal/22.1.8-win'
        required: true
        type: string
      version:
        description: 'Version label used in asset names; the release tag is llvm-<version>; bump for a new release - the defaults name the current one, so a default run stops at the "release already exists and is published" guard'
        default: '22.1.8-graal.3'
        required: true
        type: string
      publish:
        description: 'Create the GitHub release'
        default: true
        type: boolean
      platforms:
        description: 'Comma-separated subset of linux-amd64,darwin-aarch64,windows-amd64 to build'
        default: 'linux-amd64,darwin-aarch64,windows-amd64'
        required: true
        type: string

permissions:
  contents: write

env:
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  plan:
    name: Select platforms
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          all='[{"os":"ubuntu-22.04","platform":"linux-amd64"},{"os":"macos-14","platform":"darwin-aarch64"},{"os":"windows-2022","platform":"windows-amd64"}]'
          sel=$(jq -c --arg p ',${{ inputs.platforms }},' '[.[] | select(.platform as $x | $p | contains("," + $x + ","))]' <<<"$all")
          echo "matrix=$sel" >> "$GITHUB_OUTPUT"
          echo "building: $sel"
          [ "$sel" != "[]" ] || { echo "no platform selected" >&2; exit 1; }

  build:
    name: ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Checkout llvm-project
        uses: actions/checkout@v7.0.1
        with:
          repository: Throwaway68/llvm-project
          ref: ${{ inputs.llvm_ref }}
          path: llvm-project
          fetch-depth: 1
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lld
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      - name: Build
        shell: bash
        run: bash ci/scripts/llvm/build.sh "${{ matrix.platform }}" "$GITHUB_WORKSPACE/llvm-project" "$GITHUB_WORKSPACE/llvm-install" "$GITHUB_WORKSPACE/llvm-install-crt"
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Package
        shell: bash
        run: bash ci/scripts/llvm/package.sh "${{ matrix.platform }}" "${{ inputs.version }}" "$GITHUB_WORKSPACE/llvm-install" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/llvm-project" "$GITHUB_WORKSPACE/llvm-install-crt"
      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: llvm-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Release llvm-${{ inputs.version }}
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gha-graal
        uses: actions/checkout@v7.0.1
        with:
          path: ci
      - name: Download all bundles
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: llvm-*
          merge-multiple: true
          path: assets
      - name: Write manifest
        run: |
          python3 ci/scripts/release_tools.py manifest assets --version "${{ inputs.version }}" > manifest.json
          mv manifest.json assets/
          cat assets/manifest.json
      # The assets are ~1 GB each and uploads.github.com answers "HTTP 500: Error
      # saving asset" often enough that a single `gh release create <tag> assets/*`
      # is a coin flip - and when one upload fails, gh deletes the whole release.
      # So: create the release empty and as a draft, upload the assets one by one
      # with retries, verify every one of them against the local file, and only
      # then publish.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="llvm-${{ inputs.version }}"
          if state=$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::release $tag already exists and is published; pick a new version instead of overwriting it"
              exit 1
            fi
            echo "reusing the existing draft $tag"
            exit 0
          fi
          cat > notes.md <<EOF
          LLVM toolchain for GraalVM, built from \`Throwaway68/llvm-project@${{ inputs.llvm_ref }}\`
          (llvmorg-22.1.8 + graal patches). Projects: clang, lld. Targets: X86, AArch64.
          Runtimes (linux/darwin): compiler-rt builtins, libunwind, libc++abi, libc++.
          Windows: libunwind (SEH mode) under lib/x86_64-w64-windows-gnu/ for the Native Image LLVM backend.
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "LLVM ${{ inputs.version }}" \
            --notes-file notes.md \
            --draft
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="llvm-${{ inputs.version }}"
          rc=0
          for f in assets/*; do
            uploaded=no
            for attempt in 1 2 3 4 5 6; do
              echo "== uploading $(basename "$f") ($(stat -c%s "$f") bytes), attempt $attempt/6"
              if gh release upload "$tag" "$f" --repo "${{ github.repository }}" --clobber; then
                uploaded=yes
                break
              fi
              echo "attempt $attempt for $(basename "$f") failed"
              if [ "$attempt" -lt 6 ]; then
                sleep 60
              fi
            done
            if [ "$uploaded" != yes ]; then
              echo "::error::$(basename "$f") could not be uploaded in 6 attempts"
              rc=1
            fi
          done
          exit $rc
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="llvm-${{ inputs.version }}"
          gh release view "$tag" --repo "${{ github.repository }}" --json assets > published.json
          jq '[.assets[] | {name, size, state}]' published.json
          rc=0
          for f in assets/*; do
            name=$(basename "$f")
            want=$(stat -c%s "$f")
            got=$(jq -r --arg n "$name" 'first(.assets[] | select(.name == $n) | .size) // "missing"' published.json)
            state=$(jq -r --arg n "$name" 'first(.assets[] | select(.name == $n) | .state) // "missing"' published.json)
            if [ "$got" != "$want" ]; then
              echo "::error::$name: published size $got, expected $want"
              rc=1
            elif [ "$state" != "uploaded" ]; then
              echo "::error::$name: asset state is '$state', expected 'uploaded'"
              rc=1
            else
              echo "ok $name ($want bytes)"
            fi
          done
          exit $rc
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "llvm-${{ inputs.version }}" --repo "${{ github.repository }}" --draft=false
          gh release view "llvm-${{ inputs.version }}" --repo "${{ github.repository }}" --json url,isDraft,assets \
            -q '.url, .isDraft, ([.assets[].name] | join(" "))'
